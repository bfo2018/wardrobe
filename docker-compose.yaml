services:
  wardrobe-web:
    container_name: wardrobe-rentals
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_N8N_WEBHOOK_URL: ${NEXT_PUBLIC_N8N_WEBHOOK_URL:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-919826770724}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
    ports:
      - "9002:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Public URL via trycloudflare.com — restarts with the app
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wardrobe-tunnel
    command: tunnel --no-autoupdate --url http://wardrobe-web:3000
    depends_on:
      wardrobe-web:
        condition: service_healthy
    restart: unless-stopped
